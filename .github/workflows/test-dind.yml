
# This workflow tests Docker-in-Docker (dind) functionality for OpenHands
name: Test Docker-in-Docker Runtime

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ (github.head_ref && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  test-dind-runtime:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:24.0.5-dind
        options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies and build
      run: |
        pip install poetry
        poetry install --only main,dev
        make build

    - name: Test Docker-in-Docker runtime build
      env:
        INSTALL_DOCKER: 0
        RUNTIME: local
      run: |
        python -m openhands.runtime.utils.runtime_build \
          --base_image ubuntu:24.04 \
          --force_rebuild

    - name: Test Docker-in-Docker functionality in container
      env:
        INSTALL_DOCKER: 0
        RUNTIME: local
      run: |
        # Verify Docker is accessible and working inside the container
        docker info || (echo "Docker not accessible" && exit 1)
        docker version
        echo "Docker-in-Docker functionality verified successfully"

    - name: Cleanup
      if: always()
      run: |
        echo "Test completed successfully"
